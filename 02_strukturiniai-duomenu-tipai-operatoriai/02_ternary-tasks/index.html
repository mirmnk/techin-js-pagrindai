<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02 struktūriniai duomenų tipai, operatoriai >> ternary</title>
    <script src="index.html" defer />
  </head>
  <body>
    <table border="1" cellspacing="2" cellpadding="3">
      <thead>
        <tr>
          <th>Užduotie nr.</th>
          <th>Užduotis</th>
          <th></th>
          <th>Rezultatas</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>
            Write a program that checks if a number is even or odd using a
            ternary operator.
          </td>
          <td><button type="button">Start</button></td>
          <td></td>
        </tr>
        <tr>
          <td>2</td>
          <td>
            Given an <code>age</code> variable, print "Adult" if age ≥ 18,
            otherwise "Minor".
          </td>
          <td><button type="button">Start</button></td>
          <td></td>
        </tr>
        <tr>
          <td>3</td>
          <td>
            Given a temperature value, print "Hot" if temperature &gt; 30;
            otherwise print "Cool".
          </td>
          <td><button type="button">Start</button></td>
          <td></td>
        </tr>
        <tr>
          <td>4</td>
          <td>
            Given a boolean <code>isLoggedIn</code>, print "Welcome back!" if
            true or "Please log in" if false.
          </td>
          <td><button type="button">Start</button></td>
          <td></td>
        </tr>
        <tr>
          <td>5</td>
          <td>
            If a cart total ≥ 100, print "Discount applied"; otherwise print "No
            discount".
          </td>
          <td><button type="button">Start</button></td>
          <td></td>
        </tr>
        <tr>
          <td>6</td>
          <td>
            Given two numbers, use a ternary operator to print the larger one.
          </td>
          <td><button type="button">Start</button></td>
          <td></td>
        </tr>
        <tr>
          <td>7</td>
          <td>
            Given a <code>username</code>, print "Valid" if it has at least 4
            characters; otherwise print "Too short".
          </td>
          <td><button type="button">Start</button></td>
          <td></td>
        </tr>
        <tr>
          <td>8</td>
          <td>
            Check whether a number is divisible by 5. Output "Divisible" or "Not
            divisible".
          </td>
          <td><button type="button">Start</button></td>
          <td></td>
        </tr>
        <tr>
          <td>9</td>
          <td>
            Given a score, print "Pass" if score ≥ 50; otherwise print "Fail".
          </td>
          <td><button type="button">Start</button></td>
          <td></td>
        </tr>
        <tr>
          <td>10</td>
          <td>
            Given a boolean <code>darkMode</code>, set <code>theme</code> to
            "dark" if true or "light" if false.
          </td>
          <td><button type="button">Start</button></td>
          <td></td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
